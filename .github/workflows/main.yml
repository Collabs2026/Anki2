name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Locate project and build APK
        run: |
          PROJ_FILE=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then
            echo "未检测到工程文件，请确认已将解压后的 app 文件夹和 build.gradle 上传至仓库！"
            exit 1
          fi
          PROJ_DIR=$(dirname "$PROJ_FILE")
          cd "$PROJ_DIR"
          gradle assembleDebug assembleRelease

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiFlow-Android-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/release/*.apk
